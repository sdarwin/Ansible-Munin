---
# Use community.general.pkgng (not the generic `package` module) so that
# `cached` and `ignore_osver` can be set. These default to false, matching
# pkgng's own defaults. On CI boxes that deliberately run old/EOL FreeBSD
# releases, the repo catalogue may not match the running OS version ("packages
# for wrong OS version"). For those hosts set in group_vars/host_vars:
#   munin_pkg_cached: true          # skip `pkg update`; install from local cache
#   munin_pkg_ignore_osver: true    # pass IGNORE_OSVERSION=yes (STABLE/CURRENT)
- name: Install packages
  community.general.pkgng:
    name: bash
    state: present
    cached: "{{ munin_pkg_cached | bool }}"
    ignore_osver: "{{ munin_pkg_ignore_osver | bool }}"

- name: Install munin-node
  community.general.pkgng:
    name: munin-node
    state: present
    cached: "{{ munin_pkg_cached | bool }}"
    ignore_osver: "{{ munin_pkg_ignore_osver | bool }}"
  notify:
    - Run munin-node-configure-freebsd

- name: Copy munin-node configuration.
  ansible.builtin.template:
    src: munin-node.conf.j2
    dest: /usr/local/etc/munin/munin-node.conf
    owner: root
    group: wheel
    mode: "0644"
  notify: Restart munin-node

# plugin-conf.d parsed in alphabetical order
- name: Generate plugin configuration.
  ansible.builtin.template:
    src: plugin-conf.j2
    dest: /usr/local/etc/munin/plugin-conf.d/nansible.conf
    owner: root
    group: wheel
    mode: "0644"
  notify: Restart munin-node

- name: Enable additional plugins.
  ansible.builtin.file:
    path: "{{ munin_plugin_dest_path }}{{ item.name }}"
    src: "{{ munin_plugin_src_path }}{{ item.plugin | default(item.name) }}"
    state: link
  with_items: "{{ munin_node_plugins }}"
  notify: Restart munin-node

- name: Enable munin in /etc/rc.conf
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: ^munin_node_enable=
    line: munin_node_enable="YES"

- name: Ensure munin-node is running.
  ansible.builtin.command: |
    /usr/local/etc/rc.d/munin-node start
  changed_when: false
  failed_when: false
