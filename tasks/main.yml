---
# Variables ##########
#
- name: Include OS-specific variables.
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}-family.yml"

- name: Include Distribution version specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
  failed_when: false
  when:
    - ansible_facts['os_family'] != 'Darwin'

- name: Determine macos version
  ansible.builtin.set_fact:
    macos_version: "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_version'].split('.')[0] }}.{{ ansible_facts['distribution_version'].split('.')[1] }}"
  when:
    - ansible_facts['os_family'] == 'Darwin'

- name: Include Distribution version specific variables for Mac
  ansible.builtin.include_vars: "{{ macos_version }}.yml"
  failed_when: false
  when:
    - ansible_facts['os_family'] == 'Darwin'

# For every `default_<name>` variable, define `<name>` from it, but only when
# `<name>` has not already been set elsewhere (inventory, group/host vars, extra
# vars, etc.). This makes the role's per-OS `vars/*.yml` values behave like
# overridable defaults instead of high-precedence role vars.
- name: Set facts based on defaults  # noqa var-naming
  ansible.builtin.set_fact:
    "{{ item[8:] }}": "{{ lookup('vars', item) }}"
  when: item[8:] not in query('varnames', '.*')
  loop: "{{ query('varnames', '^default_') }}"

# The load plugin reads differently-named env vars depending on platform:
# macOS and FreeBSD read load_warn/load_crit, Linux reads
# load_warning/load_critical. FreeBSD requires the load plugin to honour the
# env vars, which upstream gained via our PR (previously hardcoded 10/120).
# For the CPU count, ansible_processor_vcpus is unset on FreeBSD, where
# ansible_processor_count (sysctl hw.ncpu) is the logical CPU count instead.
- name: Calculate CPU-derived thresholds for the load plugin
  ansible.builtin.set_fact:
    munin_load_warning_value: "{{ (ansible_processor_vcpus | default(ansible_processor_count) | default(1) | int) * munin_load_warning_factor | int }}"
    munin_load_critical_value: "{{ (ansible_processor_vcpus | default(ansible_processor_count) | default(1) | int) * munin_load_critical_factor | int }}"
  when:
    - munin_auto_load_thresholds | bool
    - munin_node_config['load'] is not defined

- name: Set load plugin thresholds (macOS and FreeBSD)
  ansible.builtin.set_fact:
    munin_node_config: >-
      {{ munin_node_config | combine({'load': {
            'env.load_warn': munin_load_warning_value,
            'env.load_crit': munin_load_critical_value
          }}) }}
  when:
    - munin_auto_load_thresholds | bool
    - munin_node_config['load'] is not defined
    - ansible_facts['system'] in ['Darwin', 'FreeBSD']

- name: Set load plugin thresholds (Linux)
  ansible.builtin.set_fact:
    munin_node_config: >-
      {{ munin_node_config | combine({'load': {
            'env.load_warning': munin_load_warning_value,
            'env.load_critical': munin_load_critical_value
          }}) }}
  when:
    - munin_auto_load_thresholds | bool
    - munin_node_config['load'] is not defined
    - ansible_facts['system'] == 'Linux'

##########

- name: Include client
  ansible.builtin.import_tasks: client.yml
  when: run_munin_client is defined

- name: Include server
  ansible.builtin.import_tasks: server.yml
  when: run_munin_server is defined
