---
# MacPorts will not build anything without the command line tools, and
# "port install munin" below builds from source, so this has to come first.
#
# On the dronerunner hosts that directory is deliberately not there: their
# bootstrap scripts move it to CommandLineTools.bck once the Xcode versions
# under /Applications are installed, so that builds resolve against a chosen
# Xcode rather than the tools. It is put back for the length of this file and
# moved aside again at the end, leaving the host as it was found.
- name: Check for the command line tools
  ansible.builtin.stat:
    path: /Library/Developer/CommandLineTools
  register: munin_clt

- name: Check for the command line tools moved aside
  ansible.builtin.stat:
    path: /Library/Developer/CommandLineTools.bck
  register: munin_clt_bck

# Whether this ran is what the last task in the file reads, through "is
# changed", so that hosts which simply have the tools installed normally are
# left alone rather than having them taken away.
- name: Restore the command line tools
  ansible.builtin.command:
    cmd: mv /Library/Developer/CommandLineTools.bck /Library/Developer/CommandLineTools
    creates: /Library/Developer/CommandLineTools
  when:
    - not munin_clt.stat.exists
    - munin_clt_bck.stat.exists
  register: munin_clt_restored

# Catalina's brew is pinned, by scripts/bootstrap_mac_earlier_than_14.sh in the
# dronerunner repo: 6.0.22, whose own floor is still 10.15, with homebrew-core
# checked out at a 2022 commit for the sake of the catalina bottles. Brew needs
# telling that, and these are the same two variables that script exports.
#
# NO_INSTALL_FROM_API is the one that surfaces as an error: brew otherwise reads
# formulae from formulae.brew.sh, whose per-OS index for an unsupported release
# does not exist, so every command dies on "packages.catalina.jws.json ... HTTP
# status: 404" before doing any work. NO_AUTO_UPDATE stops brew upgrading itself
# to 7.x on the first install, which would leave the host with a brew that
# refuses to start. NO_ASK is for brew 6's habit of prompting to confirm a plan
# that pulls in dependencies.
#
# Empty on every other host. Disabling the API elsewhere would send a current
# brew looking for a homebrew-core clone it has no reason to have.
- name: Set the homebrew environment
  ansible.builtin.set_fact:
    munin_catalina: "{{ munin_is_catalina | bool }}"
    munin_brew_env: "{{ munin_brew_env_catalina if munin_is_catalina | bool else {} }}"
  vars:
    munin_is_catalina: "{{ ansible_facts['distribution_version'].startswith('10.15') }}"
    munin_brew_env_catalina:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_ASK: "1"

# - name: Check if brew exists
#   stat:
#     path: /usr/local/bin/brew
#   register: brew_stat_result

# Could add a check to install or not install this depending on multiple factors
- name: Install rosetta on arm64
  ansible.builtin.command: |
    /usr/sbin/softwareupdate --install-rosetta --agree-to-license
  when: ansible_facts['architecture'] == "arm64"
  changed_when: true

# test on arm cpu also
- name: Check if brew is installed
  ansible.builtin.shell: |
    export PATH=/usr/local/bin:/opt/homebrew/bin:$PATH
    command -v brew
  args:
    executable: /bin/bash
  register: does_brew_exist
  ignore_errors: true
  changed_when: false

- name: Install brew
  ansible.builtin.command: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"
  when: does_brew_exist.rc != 0
  become: true
  become_user: administrator
  environment:
    NONINTERACTIVE: "1"
  changed_when: true

- name: Install wget
  community.general.homebrew:
    name: wget
    state: present
  become: true
  become_user: administrator
  environment: "{{ munin_brew_env }}"

- name: Check if port exists
  ansible.builtin.stat:
    path: /opt/local/bin/port
  register: port_stat_result

- name: Download port
  ansible.builtin.get_url:
    url: "{{ munin_macports_url }}"
    dest: /tmp/
    mode: "0755"
  when: not port_stat_result.stat.exists

- name: Install port
  ansible.builtin.shell: |
    sudo installer -pkg /tmp/{{ munin_macports_url | basename }} -target /
    sleep 1
    # 2022-11 this is new on m1 mac:
    sudo /opt/local/bin/port selfupdate
  when: not port_stat_result.stat.exists
  changed_when: false

# AdoptOpenJDK became Eclipse Temurin, and the adoptopenjdk/openjdk tap was
# deprecated in August 2021. Its casks still carry an "appcast" stanza, which
# Homebrew has since removed from the cask DSL, so they no longer even parse:
# "Unexpected method 'appcast' called on Cask adoptopenjdk11". Editing the cask
# to drop that stanza used to work and no longer does.
#
# Hosts provisioned earlier still have the dead cask installed and the tap
# present, and brew keeps reporting the appcast error on unrelated commands
# until both are gone. The Caskroom directory is checked directly because
# "brew list --cask" has to load the unparseable definition to answer.
- name: Remove the deprecated adoptopenjdk cask and tap
  ansible.builtin.shell: |
    export PATH=/usr/local/bin:/opt/homebrew/bin:$PATH
    if [ -d "$(brew --prefix)/Caskroom/adoptopenjdk11" ]; then
        brew uninstall --cask --force adoptopenjdk11
    fi
    if brew tap | grep -qx adoptopenjdk/openjdk; then
        brew untap adoptopenjdk/openjdk
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: administrator
  environment: "{{ munin_brew_env }}"
  register: munin_adoptopenjdk_cleanup
  changed_when: munin_adoptopenjdk_cleanup.stdout != ""
  failed_when: false

# The macports munin port needs a JDK, which is why this exists: its destroot
# includes install-plugins-java for the bundled JMX plugins, and its Portfile
# declares "java.version 1.7+" with "java.fallback openjdk11". MacPorts locates
# a JDK through /usr/libexec/java_home, which finds this cask, so it does not
# pull in its own port:openjdk11 instead. So keep this ahead of the macports
# install below.
#
# Temurin is the same JDK as the old adoptopenjdk, and it ships in
# homebrew/cask itself, so no tap. The cask is a pkg, so brew runs the
# installer under sudo: that is silent for administrator only because the
# account has passwordless sudo. Otherwise pass sudo_password to this module.
- name: Install temurin JDK
  become: true
  become_user: administrator
  environment: "{{ munin_brew_env }}"
  community.general.homebrew_cask:
    name: temurin@11
    state: present
  when: not munin_catalina | bool

# Catalina cannot reach a cask at all: with the API switched off brew wants the
# homebrew/cask tap on disk, and only homebrew-core was cloned there. Cloning a
# second large tap for one package is not worth it, so the pkg comes straight
# from Adoptium instead.
#
# These are the same bits, not a substitute. The temurin@11 cask downloads its
# pkg from the adoptium/temurin11-binaries releases and discovers versions
# through this same api.adoptium.net, so all that is skipped here is brew's
# bookkeeping. x64 is hardcoded because Catalina never ran on Apple silicon.
- name: Install temurin JDK on catalina
  when: munin_catalina | bool
  block:
    - name: Check for temurin
      ansible.builtin.stat:
        path: /Library/Java/JavaVirtualMachines/temurin-11.jdk
      register: munin_temurin

    - name: Download the temurin JDK installer
      ansible.builtin.get_url:
        url: https://api.adoptium.net/v3/installer/latest/11/ga/mac/x64/jdk/hotspot/normal/eclipse
        dest: /tmp/temurin11.pkg
        mode: "0644"
      when: not munin_temurin.stat.exists

    # Installed rather than unpacked, because what MacPorts looks for is
    # /usr/libexec/java_home, which reports the JDKs registered under
    # /Library/Java/JavaVirtualMachines. The cask does exactly this too.
    - name: Install the temurin JDK pkg
      ansible.builtin.command:
        cmd: /usr/sbin/installer -pkg /tmp/temurin11.pkg -target /
        creates: /Library/Java/JavaVirtualMachines/temurin-11.jdk
      when: not munin_temurin.stat.exists

# 2023-12 it is taking too long, I would like to tee output
