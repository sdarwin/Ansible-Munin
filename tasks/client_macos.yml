# Could add a check to install or not install this depending on multiple factors
- name: Install rosetta on arm64
  ansible.builtin.command: |
    /usr/sbin/softwareupdate --install-rosetta --agree-to-license
  when: ansible_facts['architecture'] == "arm64"
  changed_when: true

# test on arm cpu also
- name: Check if brew is installed
  ansible.builtin.shell: |
    export PATH=/usr/local/bin:/opt/homebrew/bin:$PATH
    command -v brew
  args:
    executable: /bin/bash
  register: does_brew_exist
  ignore_errors: true
  changed_when: false

- name: Install brew
  ansible.builtin.command: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"
  when: does_brew_exist.rc != 0
  become: true
  become_user: administrator
  environment:
    NONINTERACTIVE: "1"
  changed_when: true

- name: Install wget
  community.general.homebrew:
    name: wget
    state: present
  become: true
  become_user: administrator

- name: Check if port exists
  ansible.builtin.stat:
    path: /opt/local/bin/port
  register: port_stat_result

- name: Download port
  ansible.builtin.get_url:
    url: "{{ munin_macports_url }}"
    dest: /tmp/
    mode: "0755"
  when: not port_stat_result.stat.exists

- name: Install port
  ansible.builtin.shell: |
    sudo installer -pkg /tmp/{{ munin_macports_url | basename }} -target /
    sleep 1
    # 2022-11 this is new on m1 mac:
    sudo /opt/local/bin/port selfupdate
  when: not port_stat_result.stat.exists
  changed_when: false

# AdoptOpenJDK became Eclipse Temurin, and the adoptopenjdk/openjdk tap was
# deprecated in August 2021. Its casks still carry an "appcast" stanza, which
# Homebrew has since removed from the cask DSL, so they no longer even parse:
# "Unexpected method 'appcast' called on Cask adoptopenjdk11". Editing the cask
# to drop that stanza used to work and no longer does.
#
# Hosts provisioned earlier still have the dead cask installed and the tap
# present, and brew keeps reporting the appcast error on unrelated commands
# until both are gone. The Caskroom directory is checked directly because
# "brew list --cask" has to load the unparseable definition to answer.
- name: Remove the deprecated adoptopenjdk cask and tap
  ansible.builtin.shell: |
    export PATH=/usr/local/bin:/opt/homebrew/bin:$PATH
    if [ -d "$(brew --prefix)/Caskroom/adoptopenjdk11" ]; then
        brew uninstall --cask --force adoptopenjdk11
    fi
    if brew tap | grep -qx adoptopenjdk/openjdk; then
        brew untap adoptopenjdk/openjdk
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: administrator
  register: munin_adoptopenjdk_cleanup
  changed_when: munin_adoptopenjdk_cleanup.stdout != ""
  failed_when: false

# Temurin is the same JDK and ships in homebrew/cask itself, so no tap. The
# cask is a pkg, so brew runs the installer under sudo: that is silent for
# administrator only because the account has passwordless sudo. Otherwise pass
# sudo_password to this module.
- name: Install temurin JDK
  become: true
  become_user: administrator
  community.general.homebrew_cask:
    name: temurin@11
    state: present

